[project]
name = "smog-demo"
version = "0.1.0"
description = "Minimal Flask demo for the smog detection assignment."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "playwright>=1.58,<2",
    "python-docx==1.1.2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
